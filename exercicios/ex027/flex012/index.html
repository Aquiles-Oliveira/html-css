<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexible Box</title>
    <style>
      div.container {
        background-color: lightsalmon;
        display: flex;
        flex-flow: row nowrap;
      }

      div.item {
        background-color: lightskyblue;
        border: 1px solid black;
        text-align: center;
        flex-basis: 200px;
      }

      div#CxA {
        flex-shrink: 0;
        flex-grow: 0;

        flex: 1 0 200px;
      }

      div#CxB {
        flex-shrink: 0;
        flex-grow: 1;
        flex-basis: 1 1 150px;
      }

      div#CxC {
        flex-shrink: 0;
        flex-grow: 0;
        flex-basis: auto;

        flex: 1 8 auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" id="CxA">A</div>
      <div class="item" id="CxB">B</div>
      <div class="item" id="CxC">C</div>
    </div>
  </body>
</html>
